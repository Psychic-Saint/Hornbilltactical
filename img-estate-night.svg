<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A guarded estate at night with a CCTV camera and security spotlight">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151b"/><stop offset="0.6" stop-color="#0c0e12"/><stop offset="1" stop-color="#080909"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7A8"/><stop offset="0.5" stop-color="#F5A623" stop-opacity="0.5"/><stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.55"/><stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC15E"/><stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#F5A623" opacity="0.5">
    <circle cx="90" cy="60" r="1.4"/><circle cx="180" cy="40" r="1"/><circle cx="300" cy="80" r="1.3"/><circle cx="470" cy="50" r="1"/><circle cx="560" cy="90" r="1.5"/><circle cx="680" cy="46" r="1.1"/><circle cx="740" cy="110" r="1.3"/><circle cx="240" cy="120" r="1"/><circle cx="420" cy="110" r="1.1"/>
  </g>
  <!-- moon -->
  <circle cx="650" cy="110" r="90" fill="url(#moon)"/>
  <circle cx="650" cy="110" r="30" fill="#FFE7A8" opacity="0.9"/>
  <!-- distant guarded houses -->
  <g fill="#0f1217" opacity="0.9">
    <rect x="60" y="300" width="70" height="46"/><polygon points="60,300 95,278 130,300"/>
    <rect x="150" y="308" width="60" height="38"/><polygon points="150,308 180,290 210,308"/>
  </g>
  <g fill="url(#win)" opacity="0.85"><rect x="76" y="314" width="10" height="9"/><rect x="104" y="314" width="10" height="9"/><rect x="166" y="320" width="9" height="8"/></g>
  <!-- ground -->
  <rect y="360" width="800" height="140" fill="#0a0c10"/>
  <path d="M0,360 H800" stroke="#F5A623" stroke-opacity="0.15"/>
  <!-- main house -->
  <g>
    <rect x="330" y="250" width="250" height="130" fill="#161a20"/>
    <rect x="330" y="250" width="250" height="130" fill="none" stroke="#F5A623" stroke-opacity="0.4"/>
    <polygon points="320,250 455,196 590,250" fill="#1b1f26" stroke="#F5A623" stroke-opacity="0.35"/>
    <!-- lit windows -->
    <g fill="url(#win)">
      <rect x="356" y="284" width="34" height="30" rx="2"/><rect x="438" y="284" width="34" height="30" rx="2"/><rect x="520" y="284" width="34" height="30" rx="2"/>
      <rect x="438" y="330" width="34" height="46" rx="2" opacity="0.9"/>
    </g>
    <g stroke="#0a0c10" stroke-width="2"><line x1="373" y1="284" x2="373" y2="314"/><line x1="455" y1="284" x2="455" y2="314"/><line x1="537" y1="284" x2="537" y2="314"/></g>
  </g>
  <!-- perimeter fence -->
  <g stroke="#2a3138" stroke-width="4">
    <line x1="290" y1="360" x2="290" y2="410"/><line x1="320" y1="360" x2="320" y2="410"/><line x1="350" y1="360" x2="350" y2="410"/><line x1="560" y1="360" x2="560" y2="410"/><line x1="590" y1="360" x2="590" y2="410"/><line x1="620" y1="360" x2="620" y2="410"/>
  </g>
  <line x1="280" y1="366" x2="630" y2="366" stroke="#F5A623" stroke-opacity="0.5" stroke-width="2"/>
  <!-- CCTV camera pole + beam -->
  <g>
    <rect x="168" y="150" width="6" height="150" fill="#2a3138"/>
    <g transform="translate(171,150)">
      <rect x="-6" y="-14" width="30" height="16" rx="3" fill="#1b1f24" stroke="#F5A623" stroke-width="1.6"/>
      <rect x="22" y="-11" width="12" height="11" rx="2" fill="#262b31" stroke="#F5A623" stroke-width="1.6"/>
      <circle cx="28" cy="-5.5" r="3" fill="#F5A623"/>
      <circle cx="-2" cy="-10" r="2.4" fill="#ff4d4d"/>
    </g>
    <polygon points="205,146 470,320 250,360 190,300" fill="url(#beam)"/>
  </g>
  <!-- spotlight from house -->
  <polygon points="455,250 640,360 300,360" fill="#F5A623" opacity="0.06"/>
  <!-- caption chip -->
  <g>
    <rect x="24" y="452" width="212" height="30" rx="3" fill="#0a0c10" stroke="#F5A623" stroke-opacity="0.3"/>
    <circle cx="40" cy="467" r="4" fill="#4ade80"/>
    <text x="54" y="471" font-family="'Space Grotesk',sans-serif" font-size="12" letter-spacing="2" fill="#8b929c">MONITORED · PERIMETER SECURE</text>
  </g>
</svg>
