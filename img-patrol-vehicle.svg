<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" role="img" aria-label="Hornbill Tactical mobile surveillance van with roof cameras and a drone">
  <defs>
    <linearGradient id="vbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232a31"/><stop offset="1" stop-color="#12161b"/></linearGradient>
    <radialGradient id="hl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF3D0"/><stop offset="1" stop-color="#FFF3D0" stop-opacity="0"/></radialGradient>
    <radialGradient id="rotor" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F5A623" stop-opacity="0.5"/><stop offset="1" stop-color="#F5A623" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- drone hovering above -->
  <g transform="translate(150,20)">
    <ellipse cx="-26" cy="0" rx="16" ry="4" fill="url(#rotor)"/><ellipse cx="26" cy="0" rx="16" ry="4" fill="url(#rotor)"/>
    <rect x="-30" y="-1.5" width="60" height="3" rx="1.5" fill="#2a3138"/>
    <rect x="-10" y="-4" width="20" height="9" rx="2.5" fill="#1b1f24" stroke="#F5A623" stroke-width="1"/>
    <circle cx="0" cy="6" r="2.6" fill="#F5A623"/>
    <circle cx="-26" cy="0" r="2" fill="#ff4d4d"/><circle cx="26" cy="0" r="2" fill="#4ade80"/>
    <polygon points="-3,8 3,8 8,26 -8,26" fill="#F5A623" opacity="0.12"/>
  </g>

  <!-- headlight glow -->
  <ellipse cx="292" cy="120" rx="24" ry="16" fill="url(#hl)"/>

  <!-- van body -->
  <path d="M20,128 L20,72 L44,60 L150,58 L150,128 Z" fill="url(#vbody)" stroke="#F5A623" stroke-width="1.6"/>
  <path d="M150,58 L266,60 L288,86 L288,128 L150,128 Z" fill="url(#vbody)" stroke="#F5A623" stroke-width="1.6"/>
  <!-- cab windscreen + door windows -->
  <path d="M256,62 L280,86 L236,86 L236,62 Z" fill="#0c0f13" stroke="#F5A623" stroke-opacity="0.5"/>
  <rect x="60" y="70" width="80" height="22" rx="2" fill="#0c0f13" stroke="#F5A623" stroke-opacity="0.4"/>
  <line x1="100" y1="70" x2="100" y2="92" stroke="#F5A623" stroke-opacity="0.3"/>
  <!-- sliding door -->
  <line x1="150" y1="58" x2="150" y2="128" stroke="#F5A623" stroke-opacity="0.35"/>
  <line x1="196" y1="60" x2="196" y2="128" stroke="#F5A623" stroke-opacity="0.25"/>
  <!-- branding -->
  <text x="158" y="108" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="12" letter-spacing="0.5" fill="#F5A623">HORNBILL</text>
  <text x="158" y="120" font-family="'Space Grotesk',sans-serif" font-weight="500" font-size="7" letter-spacing="3" fill="#8b929c">TACTICAL · MOBILE UNIT</text>

  <!-- roof surveillance rig -->
  <rect x="70" y="54" width="70" height="6" rx="2" fill="#0c0f13" stroke="#F5A623" stroke-opacity="0.5"/>
  <!-- camera domes -->
  <path d="M84,54 a8,8 0 0 1 16,0 Z" fill="#1b1f24" stroke="#F5A623" stroke-width="1"/>
  <circle cx="92" cy="52" r="2.4" fill="#F5A623"/>
  <path d="M110,54 a8,8 0 0 1 16,0 Z" fill="#1b1f24" stroke="#F5A623" stroke-width="1"/>
  <circle cx="118" cy="52" r="2.4" fill="#F5A623"/>
  <!-- mast + PTZ camera + radar -->
  <rect x="48" y="30" width="3.5" height="30" fill="#2a3138"/>
  <g transform="translate(50,30)"><rect x="-7" y="-8" width="18" height="10" rx="2" fill="#1b1f24" stroke="#F5A623" stroke-width="1"/><rect x="9" y="-6" width="8" height="7" rx="1.5" fill="#262b31" stroke="#F5A623" stroke-width="1"/><circle cx="13" cy="-2.5" r="2" fill="#F5A623"/><circle cx="-3" cy="-4" r="1.6" fill="#ff4d4d"/></g>
  <path d="M118,40 a10,7 0 1 1 0,0.1" fill="none" stroke="#F5A623" stroke-opacity="0.4"/>

  <!-- tail + headlight -->
  <rect x="284" y="108" width="6" height="10" rx="2" fill="#FFF3D0"/>
  <rect x="20" y="112" width="5" height="9" rx="2" fill="#ff4d4d"/>

  <!-- wheels -->
  <g>
    <circle cx="78" cy="132" r="19" fill="#0a0c10" stroke="#F5A623" stroke-opacity="0.5" stroke-width="2"/><circle cx="78" cy="132" r="7.5" fill="#20262d"/>
    <circle cx="238" cy="132" r="19" fill="#0a0c10" stroke="#F5A623" stroke-opacity="0.5" stroke-width="2"/><circle cx="238" cy="132" r="7.5" fill="#20262d"/>
  </g>
</svg>
