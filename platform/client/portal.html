<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal — Hornbill Tactical</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="mobile-bar">
  <button class="hamburger" onclick="document.querySelector('.side').classList.add('open');document.querySelector('.backdrop').classList.add('show')">☰</button>
  <a class="brand" href="#" style="font-size:1rem"><img src="../assets/Hornbill_Mark_gold.png" style="height:24px" alt=""> <b class="g">TACTICAL</b></a>
  <a class="btn btn-report btn-sm" onclick="nav('report')">🚨</a>
</div>
<div class="backdrop" onclick="this.classList.remove('show');document.querySelector('.side').classList.remove('open')"></div>

<div class="shell">
  <aside class="side">
    <a class="brand" href="../../index.html"><img src="../assets/Hornbill_Mark_gold.png" style="height:26px" alt=""> HORNBILL <b class="g">TACTICAL</b></a>
    <a class="item" data-v="dashboard" onclick="nav('dashboard')"><span class="ic">▚</span> Dashboard</a>
    <a class="item" data-v="report" onclick="nav('report')" style="color:#ff8a6b"><span class="ic">🚨</span> Report an incident</a>
    <a class="item" data-v="incidents" onclick="nav('incidents')"><span class="ic">📋</span> My incidents</a>
    <a class="item" data-v="invoices" onclick="nav('invoices')"><span class="ic">🧾</span> My invoices</a>
    <a class="item" data-v="tasks" onclick="nav('tasks')"><span class="ic">✔</span> Tasks &amp; requests</a>
    <a class="item" data-v="profile" onclick="nav('profile')"><span class="ic">👤</span> Profile</a>
    <div class="spacer"></div>
    <a class="item" href="../../index.html"><span class="ic">↩</span> Hornbill website</a>
    <a class="item" onclick="logout('login.html')"><span class="ic">⏻</span> Log out</a>
  </aside>
  <main class="main" id="main"><div class="spin"></div></main>
</div>
<nav class="bottom-nav">
  <button class="bn-item" data-bn="dashboard" onclick="nav('dashboard')"><span class="bi">▚</span>Home</button>
  <button class="bn-item" data-bn="incidents" onclick="nav('incidents')"><span class="bi">📋</span>Incidents</button>
  <button class="bn-item" style="color:#ff8a6b" data-bn="report" onclick="nav('report')"><span class="bi">🚨</span>Report</button>
  <button class="bn-item" data-bn="invoices" onclick="nav('invoices')"><span class="bi">🧾</span>Invoices</button>
  <button class="bn-item" onclick="document.querySelector('.side').classList.add('open');document.querySelector('.backdrop').classList.add('show')"><span class="bi">☰</span>More</button>
</nav>

<div class="overlay right" id="drawer" onclick="if(event.target===this)close_()"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="../config.js"></script>
<script src="../app.js"></script>
<script src="../fx.js"></script>
<script>
let ME, CLIENT, CLIENT_INVOICES=[];
const main=document.getElementById("main");
function setActive(v){document.querySelectorAll(".side .item").forEach(a=>a.classList.toggle("active",a.dataset.v===v));
  document.querySelectorAll(".bn-item").forEach(a=>a.classList.toggle("active",a.dataset.bn===v));}
function closeMobile(){document.querySelector('.side').classList.remove('open');document.querySelector('.backdrop').classList.remove('show');}
function nav(v,p){setActive(v);closeMobile();views[v](p);}
function close_(){document.getElementById("drawer").classList.remove("show");}

(async()=>{
  ME=await requireRole("client","login.html");if(!ME)return;
  applyOrgSettings();
  CLIENT=ME.client;
  nav("dashboard");
})();

const views={};

/* ---------- DASHBOARD ---------- */
views.dashboard=async()=>{
  main.innerHTML='<div class="spin"></div>';
  const [{data:inc},{data:invs},{data:updates}]=await Promise.all([
    sb.from("incidents").select("id,reference,incident_type,status,source,created_at").order("created_at",{ascending:false}),
    sb.from("invoices").select("amount,status"),
    sb.from("incident_updates").select("body,created_at,author_label,visibility,incidents(reference)").order("created_at",{ascending:false}).limit(6),
  ]);
  const c=s=>inc.filter(i=>i.status===s).length;
  const open=inc.filter(i=>!["resolved","closed"].includes(i.status)).length;
  const out=invs.filter(i=>i.status==="outstanding").reduce((a,b)=>a+ +b.amount,0);
  const over=invs.filter(i=>i.status==="overdue").reduce((a,b)=>a+ +b.amount,0);
  main.innerHTML=`
    <div class="welcome">
      <div class="between" style="align-items:flex-start">
        <div>
          <div class="cmd-eyebrow" style="color:var(--gold)"><span class="live"></span> Secure client portal</div>
          <h2 style="margin:10px 0 2px">Welcome, ${esc(CLIENT?.name||ME.clientUser.full_name||"there")}</h2>
          <p class="mute" style="margin:0">Here's what's happening across your account.</p>
        </div>
        <span class="shield">🛡️</span>
      </div>
      <button class="btn btn-report" style="margin-top:16px" onclick="nav('report')">🚨 REPORT AN INCIDENT</button>
    </div>

    <div class="grid g4" style="margin-bottom:18px">
      <div class="stat3d gold" style="cursor:pointer" onclick="nav('incidents')"><div class="ic">📋</div><div class="n" data-count="${inc.length}"></div><div class="l">Total incidents ›</div></div>
      <div class="stat3d" style="cursor:pointer" onclick="nav('incidents')"><div class="ic">🔓</div><div class="n" data-count="${open}"></div><div class="l">Open ›</div></div>
      <div class="stat3d info" style="cursor:pointer" onclick="nav('incidents')"><div class="ic">🔎</div><div class="n" data-count="${c("under_investigation")}"></div><div class="l">Investigating ›</div></div>
      <div class="stat3d" style="cursor:pointer" onclick="nav('incidents')"><div class="ic">✅</div><div class="n" data-count="${c("resolved")+c("closed")}"></div><div class="l">Resolved / closed ›</div></div>
    </div>

    <div class="grid g2" style="margin-bottom:18px">
      <div class="card chart-card"><h3>My incidents by status</h3><div style="height:220px"><canvas id="cStatus"></canvas></div></div>
      <div class="card chart-card"><h3>My invoices</h3><div style="height:220px"><canvas id="cInv"></canvas></div></div>
    </div>

    <div class="grid g2">
      <div class="card">
        <div class="between"><h3>Recent incidents</h3><a class="btn btn-ghost btn-sm" onclick="nav('incidents')">View all</a></div>
        ${inc.slice(0,5).map(i=>`<div class="kv clickable" onclick="openIncident('${i.id}')">
          <span><span class="ref" style="color:var(--gold);font-family:var(--font-d)">${esc(i.reference)}</span> · ${esc(i.incident_type)}</span>
          ${statusBadge(i.status)}</div>`).join("")||'<div class="empty">No incidents yet.</div>'}
      </div>
      <div class="card">
        <h3>Your invoices</h3>
        <div class="stat" style="margin-bottom:10px"><div class="n" style="color:${out?'var(--gold)':'var(--ink)'}">${money(out)}</div><div class="l">Outstanding</div></div>
        ${over?`<div class="note-card note-internal" style="margin:0">⚠️ ${money(over)} overdue — please settle to avoid service impact.</div>`:'<p class="mute" style="font-size:.9rem">No overdue invoices. 👍</p>'}
        <a class="btn btn-ghost btn-sm btn-block" style="margin-top:12px" onclick="nav('invoices')">View invoices</a>
      </div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>Latest updates</h3>
      ${(updates||[]).length?updates.map(u=>`<div class="note-card note-client">
        <div class="who"><span><b>Hornbill updated ${esc(u.incidents?.reference||"an incident")}</b></span><span>${timeAgo(u.created_at)}</span></div>
        ${esc(u.body)}</div>`).join(""):'<div class="empty">No updates yet.</div>'}
    </div>`;
  donut("cStatus",STATUS_ORDER.map(s=>STATUS[s].label),STATUS_ORDER.map(s=>c(s)),STATUS_ORDER.map(s=>STATUS[s].color));
  const ic=s=>invs.filter(i=>i.status===s).length;
  donut("cInv",["Outstanding","Paid","Overdue"],[ic("outstanding"),ic("paid"),ic("overdue")],["#F5A623","#4ade80","#ff4d4d"]);
  window.countUp&&window.countUp(main);
};

/* ---------- REPORT ---------- */
views.report=async()=>{
  main.innerHTML=`<div class="page-head"><h2>🚨 Report an incident</h2></div>
    <div class="card gold" style="max-width:680px">
      <div class="row"><div class="field"><label>Incident type *</label>
        <select id="r_type">${['<option value="">Select…</option>'].concat(INCIDENT_TYPES.map(t=>`<option>${t}</option>`)).join("")}</select></div>
        <div class="field"><label>Urgency</label><select id="r_urg"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select></div></div>
      <div class="field"><label>Description *</label><textarea id="r_desc" placeholder="Describe what happened."></textarea></div>
      <div class="field"><label>Location *</label><input id="r_loc" placeholder="Site, gate, unit or area"></div>
      <div class="row"><div class="field"><label>Date</label><input id="r_date" type="date"></div>
        <div class="field"><label>Time</label><input id="r_time" type="time"></div></div>
      <div class="field"><label>People involved <small>(optional)</small></label><input id="r_people" placeholder="Names or descriptions"></div>
      <div class="field"><label>Supporting information <small>(optional)</small></label><textarea id="r_supp"></textarea></div>
      <div class="field"><label>Attach photos / documents <small>(optional)</small></label><input id="r_files" type="file" multiple accept="image/*,.pdf,.doc,.docx"></div>
      <div class="err" id="r_err"></div>
      <button class="btn btn-report btn-block" id="r_btn" onclick="submitClientIncident()">Submit incident</button>
    </div>`;
};
async function submitClientIncident(){
  const g=id=>document.getElementById(id).value.trim();
  const err=document.getElementById("r_err");err.textContent="";
  if(!g("r_type")||!g("r_desc")||!g("r_loc")){err.textContent="Type, description and location are required.";return;}
  const btn=document.getElementById("r_btn");btn.disabled=true;btn.textContent="Submitting…";
  const { data:inc, error }=await sb.from("incidents").insert({
    source:"client",client_id:CLIENT.id,reported_by_user:ME.user.id,
    incident_type:g("r_type"),description:g("r_desc"),location:g("r_loc"),
    incident_date:g("r_date")||null,incident_time:g("r_time")||null,
    people_involved:g("r_people"),supporting_info:g("r_supp"),urgency:document.getElementById("r_urg").value,
    contact_name:ME.clientUser.full_name,contact_email:ME.clientUser.email,contact_phone:ME.clientUser.phone,status:"submitted",
  }).select("id,reference").single();
  if(error){err.textContent=error.message;btn.disabled=false;btn.textContent="Submit incident";return;}
  // optional attachments
  const files=document.getElementById("r_files").files;
  for(const f of files){try{
    const path=`${CLIENT.id}/${inc.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
    const up=await sb.storage.from("evidence").upload(path,f,{contentType:f.type});
    if(!up.error){
      const {data:att}=await sb.from("incident_attachments").insert({incident_id:inc.id,file_name:f.name,storage_path:path,content_type:f.type,size_bytes:f.size}).select("id").single();
      if(HT_CONFIG.DRIVE_ENABLED&&att){const b64=await fileToB64(f);callFn("drive-upload",{name:f.name,mime:f.type,b64,attachment_id:att.id,incident_id:inc.id});}
    }
  }catch(_){}}
  callFn("notify-incident",{incident_id:inc.id}); // branded staff alert (active once email sender configured)
  toast("Incident "+inc.reference+" submitted","ok");
  nav("incidents");setTimeout(()=>openIncident(inc.id),300);
}

/* ---------- INCIDENTS LIST ---------- */
views.incidents=async()=>{
  main.innerHTML='<div class="page-head"><h2>My incidents</h2><button class="btn btn-report" onclick="nav(\'report\')">🚨 Report</button></div><div class="spin"></div>';
  const {data:inc}=await sb.from("incidents").select("*").order("created_at",{ascending:false});
  const rows=(inc||[]).map(i=>`<tr class="clickable" onclick="openIncident('${i.id}')">
    <td class="ref">${esc(i.reference)}</td><td>${esc(i.incident_type)}</td>
    <td>${esc(i.location||"—")}</td><td>${statusBadge(i.status)}</td><td>${fmtDate(i.created_at)}</td></tr>`).join("");
  main.innerHTML=`<div class="page-head"><h2>My incidents</h2><button class="btn btn-report" onclick="nav('report')">🚨 Report</button></div>
    <div class="tablewrap"><table class="table"><thead><tr><th>Reference</th><th>Type</th><th>Location</th><th>Status</th><th>Reported</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="5"><div class="empty">No incidents yet. Tap “Report” to log one.</div></td></tr>'}</tbody></table></div>`;
};

async function openIncident(id){
  const dr=document.getElementById("drawer");dr.classList.add("show");
  dr.innerHTML='<div class="drawer"><div class="spin"></div></div>';
  const [{data:i},{data:hist},{data:updates},{data:atts}]=await Promise.all([
    sb.from("incidents").select("*").eq("id",id).single(),
    sb.from("incident_status_history").select("status,note,created_at").eq("incident_id",id).order("created_at"),
    sb.from("incident_updates").select("body,author_label,created_at,visibility").eq("incident_id",id).order("created_at",{ascending:false}),
    sb.from("incident_attachments").select("file_name,storage_path").eq("incident_id",id),
  ]);
  const clientUpdates=(updates||[]).filter(u=>u.visibility==="client");
  dr.innerHTML=`<div class="drawer">
    <div class="between"><h2 class="g" style="font-size:1.3rem;margin:0">${esc(i.reference)}</h2><button class="x" onclick="close_()">×</button></div>
    <div class="wrap-gap" style="margin:12px 0 18px">${statusBadge(i.status)} ${urgencyBadge(i.urgency)} ${sourceBadge(i.source)}</div>
    <div class="card" style="margin-bottom:16px">
      <div class="kv"><b>Type</b><span>${esc(i.incident_type)}</span></div>
      <div class="kv"><b>Location</b><span>${esc(i.location||"—")}</span></div>
      <div class="kv"><b>Date / time</b><span>${fmtDate(i.incident_date)}${i.incident_time?" · "+i.incident_time.slice(0,5):""}</span></div>
      <div class="kv"><b>Reported</b><span>${fmtDateTime(i.created_at)}</span></div>
      ${i.people_involved?`<div class="kv"><b>People involved</b><span>${esc(i.people_involved)}</span></div>`:""}
    </div>
    <div class="card" style="margin-bottom:16px"><b class="mute" style="font-size:.78rem">DESCRIPTION</b><p style="margin:8px 0 0">${esc(i.description||"—")}</p></div>
    ${atts&&atts.length?`<div class="card" style="margin-bottom:16px"><b class="mute" style="font-size:.78rem">EVIDENCE</b>
      <div style="margin-top:8px">${atts.map(a=>`<div class="filerow"><span>📄 ${esc(a.file_name)}</span><button class="btn btn-sm btn-ghost" onclick="dl('${esc(a.storage_path)}')">View</button></div>`).join("")}</div></div>`:""}
    <div class="card" style="margin-bottom:16px"><h3>Updates from Hornbill</h3>
      ${clientUpdates.length?clientUpdates.map(u=>`<div class="note-card note-client">
        <div class="who"><span class="note-tag" style="color:var(--info)">Hornbill update</span><span>${fmtDateTime(u.created_at)}</span></div>${esc(u.body)}</div>`).join(""):'<p class="mute" style="font-size:.9rem">No updates yet. We\'ll notify you here.</p>'}
    </div>
    <div class="card"><h3>Progress</h3><div class="timeline">${buildTimeline(hist||[])}</div></div>
  </div>`;
}
async function dl(path){const {data,error}=await sb.storage.from("evidence").createSignedUrl(path,120);
  if(error){toast("Could not open file","err");return;}window.open(data.signedUrl,"_blank");}

/* ---------- INVOICES ---------- */
views.invoices=async()=>{
  main.innerHTML='<div class="page-head"><h2>My invoices</h2></div><div class="spin"></div>';
  const {data:invs}=await sb.from("invoices").select("*").order("issued_date",{ascending:false});
  CLIENT_INVOICES=invs||[];
  const sum=s=>invs.filter(i=>i.status===s).reduce((a,b)=>a+ +b.amount,0);
  const badge=s=>({outstanding:`<span class="badge" style="color:var(--gold);border-color:var(--line)">Outstanding</span>`,
    paid:`<span class="badge" style="color:var(--ok);border-color:#4ade8044">Paid</span>`,
    overdue:`<span class="badge" style="color:var(--crit);border-color:#ff4d4d44">Overdue</span>`}[s]);
  main.innerHTML=`<div class="page-head"><h2>My invoices</h2></div>
    <div class="grid g3" style="margin-bottom:18px">
      <div class="stat accent"><div class="n">${money(sum("outstanding"))}</div><div class="l">Outstanding</div></div>
      <div class="stat"><div class="n" style="color:var(--crit)">${money(sum("overdue"))}</div><div class="l">Overdue</div></div>
      <div class="stat"><div class="n" style="color:var(--ok)">${money(sum("paid"))}</div><div class="l">Paid (history)</div></div>
    </div>
    <div class="tablewrap"><table class="table"><thead><tr><th>Invoice</th><th>Description</th><th>Amount</th><th>Due</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody>${(invs||[]).map(i=>`<tr><td class="ref">${esc(i.number)}</td><td>${esc(i.description||"—")}</td>
      <td>${money(i.amount,i.currency)}</td><td>${fmtDate(i.due_date)}</td><td>${badge(i.status)}</td>
      <td style="text-align:right"><button class="btn btn-sm btn-ghost" onclick="viewClientInvoice('${i.id}')">View PDF</button></td></tr>`).join("")
      ||'<tr><td colspan="6"><div class="empty">No invoices.</div></td></tr>'}</tbody></table></div>`;
};
function viewClientInvoice(id){
  const inv=CLIENT_INVOICES.find(x=>x.id===id);if(!inv)return;
  if(!window.jspdf){toast("PDF library still loading, try again","err");return;}
  viewInvoicePdf(inv,{name:CLIENT.name,contact_email:CLIENT.contact_email,contact_phone:CLIENT.contact_phone,address:CLIENT.address});
}

/* ---------- TASKS ---------- */
views.tasks=async()=>{
  main.innerHTML='<div class="page-head"><h2>Tasks &amp; requests</h2></div><div class="spin"></div>';
  const {data:tasks}=await sb.from("tasks").select("*").order("created_at",{ascending:false});
  const st=s=>({open:'<span class="badge" style="color:var(--mute)">Open</span>',in_progress:'<span class="badge" style="color:var(--gold);border-color:var(--line)">In progress</span>',done:'<span class="badge" style="color:var(--ok);border-color:#4ade8044">Done</span>',cancelled:'<span class="badge" style="color:var(--mute)">Cancelled</span>'}[s]);
  main.innerHTML=`<div class="page-head"><h2>Tasks &amp; requests</h2><button class="btn btn-primary" onclick="newRequest()">+ New request</button></div>
    <div class="tablewrap"><table class="table"><thead><tr><th>Request</th><th>Detail</th><th>Type</th><th>Due</th><th>Status</th></tr></thead>
    <tbody>${(tasks||[]).map(t=>`<tr><td><b>${esc(t.title)}</b></td><td>${esc(t.description||"—")}</td>
      <td>${t.is_client_request?'<span class="tag">Your request</span>':'<span class="tag">Hornbill</span>'}</td><td>${fmtDate(t.due_date)}</td><td>${st(t.status)}</td></tr>`).join("")
      ||'<tr><td colspan="5"><div class="empty">No tasks or requests yet.</div></td></tr>'}</tbody></table></div>`;
};
function newRequest(){
  const dr=document.getElementById("drawer");dr.classList.add("show");
  dr.innerHTML=`<div class="drawer"><div class="between"><h2 style="margin:0">New request</h2><button class="x" onclick="close_()">×</button></div>
    <p class="mute">Send a request to your Hornbill team.</p>
    <div class="field"><label>Title *</label><input id="t_title" placeholder="e.g. Add extra patrol this weekend"></div>
    <div class="field"><label>Details</label><textarea id="t_desc"></textarea></div>
    <div class="field"><label>Needed by <small>(optional)</small></label><input id="t_due" type="date"></div>
    <div class="err" id="t_err"></div>
    <button class="btn btn-primary btn-block" id="t_btn" onclick="submitRequest()">Send request</button></div>`;
}
async function submitRequest(){
  const g=id=>document.getElementById(id).value.trim();const err=document.getElementById("t_err");err.textContent="";
  if(!g("t_title")){err.textContent="Please enter a title.";return;}
  const btn=document.getElementById("t_btn");btn.disabled=true;btn.textContent="Sending…";
  const {error}=await sb.from("tasks").insert({client_id:CLIENT.id,title:g("t_title"),description:g("t_desc"),
    due_date:g("t_due")||null,is_client_request:true,requested_by:ME.user.id,status:"open"});
  if(error){err.textContent=error.message;btn.disabled=false;btn.textContent="Send request";return;}
  close_();toast("Request sent to Hornbill","ok");nav("tasks");
}

/* ---------- PROFILE ---------- */
views.profile=async()=>{
  main.innerHTML=`<div class="page-head"><h2>Profile</h2></div>
    <div class="card" style="max-width:560px">
      <div class="kv"><b>Organisation</b><span>${esc(CLIENT?.name||"—")}</span></div>
      <div class="kv"><b>Name</b><span>${esc(ME.clientUser.full_name||"—")}</span></div>
      <div class="kv"><b>Email</b><span>${esc(ME.clientUser.email||"—")}</span></div>
      <div class="kv"><b>Phone</b><span>${esc(ME.clientUser.phone||"—")}</span></div>
      <div class="kv"><b>Site</b><span>${esc(CLIENT?.address||"—")}</span></div>
    </div>
    <div class="card" style="max-width:560px;margin-top:16px">
      <h3>Link a guest report</h3>
      <p class="mute" style="font-size:.9rem">Reported an incident before creating this account? Enter its reference to add it here (the email must match your account).</p>
      <div class="row"><input id="claim_ref" placeholder="INC-2026-00142" style="text-transform:uppercase">
        <button class="btn btn-steel" onclick="claim()">Link incident</button></div>
      <div class="err" id="claim_err"></div>
    </div>
    <div style="margin-top:16px"><button class="btn btn-ghost" onclick="logout('login.html')">Log out</button></div>`;
};
async function claim(){
  const ref=document.getElementById("claim_ref").value.trim();const err=document.getElementById("claim_err");err.textContent="";
  if(!ref){err.textContent="Enter a reference number.";return;}
  const res=await callFn("claim-incident",{reference:ref});
  if(!res||!res.ok){err.textContent=res?.error||"Could not link that incident.";return;}
  toast("Incident "+ref+" linked to your account","ok");nav("incidents");
}
</script>
